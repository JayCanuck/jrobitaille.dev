# CI: every deterministic gate on pull requests and main (format, lint, knip, typecheck, unit, build, e2e + axe). No model runs here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The self-hosted fonts' fallback faces are declared as local(Arial) with metric
      # adjustments (D15 amendment). Linux has no Arial, so the runner needs a metric-compatible
      # substitute: Liberation Sans. The step prints what fontconfig resolves, so the test log and
      # the record name the face actually rendered, and pins the alias only if it is wrong.
      - name: Metric-compatible fallback font
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
          echo "fc-match Arial -> $(fc-match Arial)"
          echo "fc-match 'Geist Fallback' -> $(fc-match 'Geist Fallback')"
          if ! fc-match Arial | grep -qi liberation; then
            mkdir -p ~/.config/fontconfig
            printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' '  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>' '</fontconfig>' > ~/.config/fontconfig/fonts.conf
            fc-cache -f >/dev/null
            echo "after alias: fc-match Arial -> $(fc-match Arial)"
          fi
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Stage one of the TypeScript 7 migration: native-compiler diagnostics on every PR without gating merges.
  # typescript@7 publishes the native compiler as `tsc`; the `tsgo` binary name lives in @typescript/native-preview.
  typecheck-tsgo:
    name: typecheck (tsgo preview)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx -y -p typescript@7 tsc --noEmit

  # Lighthouse CI (spec §6): mobile preset against the export served by wrangler dev, asserting
  # performance >= 0.95 and accessibility, best practices and SEO at 1.0 (lighthouserc.json).
  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lighthouse
