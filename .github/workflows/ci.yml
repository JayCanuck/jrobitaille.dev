# CI: every deterministic gate on pull requests and main (format, lint, knip, typecheck, unit, build, e2e + axe). No model runs here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Diagnostic only, no font installs (D15 amendment): the layout must be immune to whatever
      # fallback face a platform has, and the delayed-font e2e forces both a metric-compatible
      # face and a mismatched one. This prints what the runner would resolve, so the log names them.
      - name: Fallback font resolution (diagnostic)
        run: |
          for family in Arial 'Liberation Sans' Arimo Roboto 'DejaVu Sans' sans-serif; do
            echo "fc-match '$family' -> $(fc-match "$family")"
          done
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Stage one of the TypeScript 7 migration: native-compiler diagnostics on every PR without gating merges.
  # typescript@7 publishes the native compiler as `tsc`; the `tsgo` binary name lives in @typescript/native-preview.
  typecheck-tsgo:
    name: typecheck (tsgo preview)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx -y -p typescript@7 tsc --noEmit

  # Lighthouse CI (spec §6): mobile preset against the export served by wrangler dev, asserting
  # performance >= 0.95 and accessibility, best practices and SEO at 1.0 (lighthouserc.json).
  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lighthouse
